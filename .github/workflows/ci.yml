name: CI & GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax check ES modules
        run: |
          node --check src/shapes.js
          node --check src/diffusion.js
          node --check src/renderer.js
          node --check src/main.js
          node --check tests/diffusion.test.js

      - name: Run unit tests
        run: node --test tests/diffusion.test.js

      - name: Verify relative asset paths for GitHub Pages subpath
        run: |
          node -e '
            const fs = require("node:fs");
            const html = fs.readFileSync("index.html", "utf8");
            if (/(?:href|src)=["'\''"]\//i.test(html)) {
              throw new Error("Found root-relative asset path in index.html");
            }
            for (const f of ["styles.css", "src/main.js", "src/diffusion.js", "src/renderer.js", "src/shapes.js"]) {
              if (!fs.existsSync(f)) throw new Error("Missing asset: " + f);
            }
            console.log("Relative asset check passed.");
          '

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Stage static site artifact
        run: |
          mkdir -p _site/src
          cp index.html styles.css _site/
          cp src/*.js _site/src/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
